name: tdc-caco2-scaffold

dataset:
  provider: tdc_adme
  name: Caco2_Wang
  smiles_column: Drug
  targets:
    permeability:
      column: Y
      unit: cm/s

features:
  composition:
    type: elements
    elements: [H, C, N, O, S, P, F, Cl, Br, I]
  bonds:
    type: bond_pairs
    elements: [H, C, N, O, S, P, F, Cl, Br, I]
    bond_orders: ["1", "2", "3", "a"]
  ester:
    type: smarts
    pattern: "[CX3](=O)[OX2][#6]"
    mode: count

routes:
  permeability: [composition, bonds, ester]

tasks:
  permeability:
    target: permeability
    kind: scalar
    route: permeability

split:
  method: scaffold
  fractions: [0.7, 0.1, 0.2]
  seed: 42

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  loss: huber
  patience: 15
  device: auto

evaluation:
  metrics: [mae, rmse, r2]

analysis:
  enabled: true
  support_threshold: 5
  correlation_threshold: 0.95
  bins: 20
  output_dir: analysis

cache:
  enabled: true
  directory: .chemistry_cache/features
