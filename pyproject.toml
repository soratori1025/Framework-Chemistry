[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teb-framework"
version = "0.1.0"
description = "Composable blocks for molecular property prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "soratori1025" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
chemistry = ["rdkit"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["teb_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/soratori1025/Framework-Chemistry"
Repository = "https://github.com/soratori1025/Framework-Chemistry"
Issues = "https://github.com/soratori1025/Framework-Chemistry/issues"
