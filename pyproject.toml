[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemistry-framework"
version = "0.1.0"
description = "Composable blocks for molecular property prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "soratori1025" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
chemistry = ["rdkit"]
graph = ["torch-geometric>=2.4"]
benchmarks = ["torch-geometric>=2.4", "PyTDC>=0.4.0"]
test = ["pytest>=7"]

[project.scripts]
chemistry-framework = "chemistry_framework.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chemistry_framework*"]

[tool.setuptools.package-data]
chemistry_framework = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/soratori1025/Framework-Chemistry"
Repository = "https://github.com/soratori1025/Framework-Chemistry"
Issues = "https://github.com/soratori1025/Framework-Chemistry/issues"
