name: tdc-caco2-dmpnn

dataset:
  provider: tdc_adme
  name: Caco2_Wang
  smiles_column: Drug
  targets:
    permeability:
      column: Y
      unit: cm/s

features:
  composition:
    type: elements
    elements: [H, C, N, O, S, P, F, Cl, Br, I]
  bonds:
    type: bond_pairs
    elements: [H, C, N, O, S, P, F, Cl, Br, I]
    bond_orders: ["1", "2", "3", "a"]
  ester:
    type: smarts
    pattern: "[CX3](=O)[OX2][#6]"
    mode: count

routes:
  permeability: [composition, bonds, ester]

tasks:
  permeability:
    target: permeability
    kind: scalar
    route: permeability

split:
  method: scaffold
  fractions: [0.8, 0.1, 0.1]
  seed: 42

model:
  structure:
    encoder: dmpnn
    hidden_dim: 128
    depth: 3
    aggregation: mean
    dropout: 0.1
  descriptors:
    enabled: true
    hidden_dim: 64
    depth: 1
    dropout: 0.1
  fusion: concat
  ffn:
    hidden_dim: 128
    depth: 2
    dropout: 0.1
  head: regression

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  loss: huber
  scheduler: cosine
  warmup_epochs: 3
  grad_clip: 1.0
  patience: 10
  device: auto
  checkpoint_dir: ../results/checkpoints

evaluation:
  metrics: [mae, rmse, r2]

analysis:
  enabled: false

cache:
  enabled: false
